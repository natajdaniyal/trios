<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}html,body{margin:0;background:transparent}body{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eef5ff}
.lab{position:relative;min-height:560px;height:min(70vh,700px);width:100%;overflow:hidden;border:1px solid rgba(155,209,255,.16);border-radius:28px;background:radial-gradient(circle at 50% 46%,rgba(92,199,255,.13),transparent 27%),radial-gradient(circle at 80% 20%,rgba(172,116,255,.09),transparent 23%),radial-gradient(circle at 18% 78%,rgba(65,175,255,.07),transparent 25%),linear-gradient(180deg,#0b1430 0%,#070d20 55%,#050918 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.045),0 28px 80px rgba(0,0,0,.24);user-select:none;touch-action:none}
.lab:before{content:"";position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle at 8% 18%,rgba(255,255,255,.46) 0 1px,transparent 1.4px),radial-gradient(circle at 16% 62%,rgba(255,255,255,.20) 0 1px,transparent 1.4px),radial-gradient(circle at 29% 28%,rgba(255,255,255,.24) 0 1px,transparent 1.4px),radial-gradient(circle at 42% 74%,rgba(255,255,255,.20) 0 1px,transparent 1.4px),radial-gradient(circle at 57% 19%,rgba(255,255,255,.35) 0 1px,transparent 1.4px),radial-gradient(circle at 72% 68%,rgba(255,255,255,.22) 0 1px,transparent 1.4px),radial-gradient(circle at 86% 27%,rgba(255,255,255,.30) 0 1px,transparent 1.4px),radial-gradient(circle at 93% 76%,rgba(255,255,255,.18) 0 1px,transparent 1.4px);opacity:.9}
.lab:after{content:"";position:absolute;inset:16% 9% 17%;border-radius:50%;border:1px solid rgba(123,193,255,.035);box-shadow:0 0 0 42px rgba(113,178,255,.018),0 0 0 84px rgba(113,178,255,.012);pointer-events:none}
.lab-top{position:absolute;left:18px;right:18px;top:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:4;pointer-events:none}
.lab-badge,.lab-status{padding:7px 10px;border-radius:999px;background:rgba(7,15,34,.58);border:1px solid rgba(166,215,255,.10);backdrop-filter:blur(10px);font-size:11px}
.lab-badge{color:#a8bfdf;letter-spacing:.09em;text-transform:uppercase}.lab-status{display:flex;align-items:center;gap:7px;color:#91a8cc}.lab-status i{display:block;width:7px;height:7px;border-radius:50%;background:#5ee4ff;box-shadow:0 0 12px rgba(94,228,255,.65)}.lab.disabled .lab-status i{background:#8290ad;box-shadow:none}
.hint{position:absolute;left:50%;top:58px;transform:translateX(-50%);max-width:78%;padding:8px 13px;border-radius:999px;background:rgba(8,16,37,.68);border:1px solid rgba(166,215,255,.09);color:#91a8cc;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;backdrop-filter:blur(10px);z-index:5}
.track{position:absolute;left:8%;right:8%;top:50%;height:1px;background:linear-gradient(90deg,transparent,rgba(149,194,255,.14) 12%,rgba(149,194,255,.24) 50%,rgba(149,194,255,.14) 88%,transparent);pointer-events:none}.track:before{content:"";position:absolute;top:-220px;bottom:-220px;left:50%;width:1px;background:linear-gradient(180deg,transparent,rgba(149,194,255,.10) 18%,rgba(149,194,255,.18) 50%,rgba(149,194,255,.10) 82%,transparent)}.track:before{left:0}.track:after{right:0}
.scale{position:absolute;left:7%;right:7%;bottom:18px;height:18px;display:flex;justify-content:space-between;align-items:flex-end;color:#597092;font-size:10px;pointer-events:none}.scale em{display:block;width:1px;height:7px;background:rgba(130,170,218,.22);font-style:normal}
.force-line{position:absolute;height:2px;transform-origin:left center;border-radius:999px;opacity:0;filter:drop-shadow(0 0 7px currentColor);pointer-events:none;transition:opacity .25s ease}.force-line.attract{background:linear-gradient(90deg,transparent,#7ce7ff 28%,#d7f8ff 50%,#7ce7ff 72%,transparent);color:#75e5ff}.force-line.repel{background:linear-gradient(90deg,transparent,#b38aff 28%,#ffd0f2 50%,#b38aff 72%,transparent);color:#b38aff}.lab.live .force-line{opacity:.52}.lab.live .force-line.strong{opacity:.86}
.magnet{position:absolute;top:0;width:154px;height:68px;transform:translate(-50%,-50%);border-radius:16px;cursor:grab;z-index:3;filter:drop-shadow(0 16px 28px rgba(0,0,0,.28))}.magnet:before{content:"";position:absolute;inset:-10px;border-radius:22px;background:radial-gradient(circle,rgba(103,219,255,.15),transparent 65%);opacity:.8;pointer-events:none}.magnet:active{cursor:grabbing}.magnet.disabled{cursor:default;opacity:.94}.magnet.dragging{filter:drop-shadow(0 18px 34px rgba(38,177,255,.26))}
.magnet-body{position:absolute;inset:0;display:flex;overflow:hidden;border-radius:16px;border:1px solid rgba(255,255,255,.20);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),inset 0 -10px 20px rgba(0,0,0,.12),0 0 0 1px rgba(0,0,0,.10)}
.pole{flex:1;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:900;letter-spacing:.08em;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.20)}.pole.n{background:linear-gradient(145deg,#ff7288,#ad3152)}.pole.s{background:linear-gradient(145deg,#62c8ff,#2e61b3)}.pole:first-child{border-radius:15px 0 0 15px}.pole:last-child{border-radius:0 15px 15px 0}
.magnet-name{position:absolute;left:50%;top:76px;transform:translateX(-50%);color:#a8bddf;font-weight:800;font-size:11px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}.magnet-glint{position:absolute;left:10px;right:10px;top:7px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);opacity:.7;pointer-events:none}
.snap{position:absolute;left:50%;bottom:38px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;color:#6c85ac;font-size:10px;white-space:nowrap;pointer-events:none}.snap b{width:5px;height:5px;border-radius:50%;background:#5ee4ff;box-shadow:0 0 8px rgba(94,228,255,.5)}
@media(max-width:720px){.lab{min-height:480px;height:540px;border-radius:22px}.magnet{width:128px;height:58px}.magnet-name{top:66px}.hint{top:56px;max-width:86%}}
</style>
</head>
<body><div id="root"></div>
<script>
(function(){
const root=document.getElementById("root");let args={magnets:[],positions:{},disabled:false,hint:null,trajectory:null};let positions={};let drag=null;
function send(type,payload){window.parent.postMessage(Object.assign({isStreamlitMessage:true,type:type},payload),"*")}
function ready(){send("streamlit:componentReady",{apiVersion:1});send("streamlit:setFrameHeight",{height:560})}
function px(x,lab){const w=lab.clientWidth;return w*.08+((Number(x)+4)/8)*(w*.84)}
function py(y,lab){const h=lab.clientHeight;return h*.50-(Number(y)/3)*(h*.31)}
function valX(p,lab){const w=lab.clientWidth;return Math.max(-4,Math.min(4,((p-w*.08)/(w*.84))*8-4))}
function valY(p,lab){const h=lab.clientHeight;return Math.max(-3,Math.min(3,((h*.50-p)/(h*.31))*3))}
function send(type,payload){window.parent.postMessage(Object.assign({isStreamlitMessage:true,type:type},payload),"*")}
function publish(){send("streamlit:setComponentValue",{valueType:"json",value:JSON.parse(JSON.stringify(positions))})}
function magnetSize(lab){return lab.clientWidth<=720?{w:128,h:58}:{w:154,h:68};}
function radiusOf(m){
  const r=m && Number(m.collision_radius);
  return (typeof r==="number" && isFinite(r) && r>0) ? r : 0.62;
}
function resolveCollisionCandidate(name,candidate,lab){
  let x=Math.max(-4,Math.min(4,candidate.x));
  let y=Math.max(-3,Math.min(3,candidate.y));
  const rSelf=radiusOf((args.magnets||[]).find(m=>m.name===name));
  for(let iter=0;iter<4;iter++){
    for(const m of(args.magnets||[])){
      if(m.name===name||!positions[m.name])continue;
      const other=positions[m.name];
      const minDist=rSelf+radiusOf(m);
      const dx=x-other.x,dy=y-other.y;
      const dist=Math.hypot(dx,dy);
      if(dist<minDist){
        const nx=dist===0?1:dx/dist;
        const ny=dist===0?0:dy/dist;
        x=other.x+nx*minDist;
        y=other.y+ny*minDist;
      }
    }
    x=Math.max(-4,Math.min(4,x));
    y=Math.max(-3,Math.min(3,y));
  }
  return {x,y};
}
function renderForces(lab,magnets){
  lab.querySelectorAll(".force-line").forEach(x=>x.remove());
  const ordered=magnets.map(m=>({m,p:positions[m.name]||{x:0,y:0}}));
  for(let i=0;i<ordered.length;i++)for(let j=i+1;j<ordered.length;j++){
    const a=ordered[i],b=ordered[j];
    const x1=px(a.p.x,lab),y1=py(a.p.y,lab),x2=px(b.p.x,lab),y2=py(b.p.y,lab);
    const dx=x2-x1,dy=y2-y1,dist=Math.max(30,Math.hypot(dx,dy));
    const line=document.createElement("div");line.className="force-line "+(a.m.pole&&b.m.pole?(a.m.pole===b.m.pole?"repel":"attract"):(a.m.right_pole===b.m.left_pole?"repel":"attract"));
    line.style.left=x1+"px";line.style.top=y1+"px";line.style.width=dist+"px";line.style.transform="rotate("+Math.atan2(dy,dx)+"rad)";
    line.style.opacity=args.disabled?".0":(dist<220?".78":".38");lab.appendChild(line);
  }
}
function render(){
  positions={};
  for(const m of (args.magnets||[])){
    const p=args.positions&&args.positions[m.name];
    positions[m.name]=typeof p==="object"?{x:Number(p.x)||0,y:Number(p.y)||0}:{x:Number(p)||0,y:0};
  }
  root.innerHTML="";
  const lab=document.createElement("div");lab.className="lab "+(args.disabled?"disabled":"live");
  const top=document.createElement("div");top.className="lab-top";
  const badge=document.createElement("div");badge.className="lab-badge";badge.textContent="TRIOS · LAB";
  const status=document.createElement("div");status.className="lab-status";const dot=document.createElement("i");status.appendChild(dot);const st=document.createElement("span");st.textContent=args.disabled?"":"LIVE";status.appendChild(st);top.append(badge,status);lab.appendChild(top);
  const hint=document.createElement("div");hint.className="hint";hint.textContent=args.hint||"";lab.appendChild(hint);
  const track=document.createElement("div");track.className="track";lab.appendChild(track);
  root.appendChild(lab);
  for(const m of (args.magnets||[])){
    const el=document.createElement("div");el.className="magnet"+(args.disabled?" disabled":"");el.dataset.name=m.name;
    const place=()=>{el.style.left=px(positions[m.name].x,lab)+"px";el.style.top=py(positions[m.name].y,lab)+"px"};
    place();
    const body=document.createElement("div");body.className="magnet-body";const a=document.createElement("div");a.className="pole "+m.left_pole.toLowerCase();a.textContent=m.left_pole;const b=document.createElement("div");b.className="pole "+m.right_pole.toLowerCase();b.textContent=m.right_pole;const glint=document.createElement("div");glint.className="magnet-glint";body.append(a,b,glint);
    const name=document.createElement("div");name.className="magnet-name";name.textContent=m.name;
    const snap=document.createElement("div");snap.className="snap";const bullet=document.createElement("b");snap.append(bullet);const snapText=document.createElement("span");snapText.textContent=args.disabled?"":"MOVE";snap.append(snapText);
    el.append(body,name,snap);lab.appendChild(el);
    if(!args.disabled)el.addEventListener("pointerdown",e=>{if(e.button!==0)return;drag={name:m.name,pointerId:e.pointerId};el.classList.add("dragging");try{el.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault()});
  }
  renderForces(lab,args.magnets||[]);send("streamlit:setFrameHeight",{height:560});
  if(Array.isArray(args.trajectory)&&args.trajectory.length>1)playTrajectory(args.trajectory,lab);
}
function playTrajectory(frames,lab){
  if(!Array.isArray(frames)||frames.length<2||args.disabled!==true)return;
  let frame=0;
  const apply=()=>{
    if(frame>=frames.length)return;
    const snapshot=frames[frame]||[];
    for(const body of snapshot){
      const p={x:Number(body.position_x)||0,y:Number(body.position_y)||0};positions[body.name]=p;
      const el=lab.querySelector('.magnet[data-name="'+body.name+'"]');if(el){el.style.left=px(p.x,lab)+"px";el.style.top=py(p.y,lab)+"px"}
    }
    renderForces(lab,args.magnets||[]);frame+=1;if(frame<frames.length)window.setTimeout(apply,55);
  };apply();
}
document.addEventListener("pointermove",e=>{if(!drag||args.disabled)return;const lab=document.querySelector(".lab");if(!lab)return;const r=lab.getBoundingClientRect();const raw={x:Math.round(valX(e.clientX-r.left,lab)*4)/4,y:Math.round(valY(e.clientY-r.top,lab)*4)/4};
const resolved=resolveCollisionCandidate(drag.name,raw,lab);positions[drag.name]=resolved;
const el=lab.querySelector('.magnet[data-name="'+drag.name+'"]');
if(el){el.style.left=px(positions[drag.name].x,lab)+"px";el.style.top=py(positions[drag.name].y,lab)+"px"}
renderForces(lab,args.magnets||[])});
document.addEventListener("pointerup",()=>{if(!drag)return;const lab=document.querySelector(".lab");const el=lab&&lab.querySelector('.magnet[data-name="'+drag.name+'"]');if(el)el.classList.remove("dragging");publish();drag=null});
window.addEventListener("blur",()=>{drag=null});window.addEventListener("message",e=>{if(e.data&&e.data.type==="streamlit:render"){args=e.data.args||args;render()}});ready();
})();
</script>
</body>
</html>
