<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}html,body{margin:0;background:transparent}body{font-family:Inter,system-ui,sans-serif;color:#eef4ff}
.lab{position:relative;height:330px;width:100%;overflow:hidden;border:1px solid rgba(183,210,255,.16);border-radius:22px;background:radial-gradient(circle at 50% 45%,rgba(122,128,255,.13),transparent 42%),linear-gradient(180deg,rgba(18,25,49,.96),rgba(8,13,29,.98));user-select:none;touch-action:none}
.grid{position:absolute;left:7%;right:7%;top:50%;height:1px;background:rgba(194,214,255,.25)}
.hint{position:absolute;left:50%;top:20px;transform:translateX(-50%);padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.055);border:1px solid rgba(183,210,255,.12);color:#b8c6e5;font-size:13px;white-space:nowrap;pointer-events:none}
.magnet{position:absolute;top:50%;width:120px;height:56px;transform:translate(-50%,-50%);display:flex;border-radius:13px;overflow:visible;cursor:grab;border:2px solid rgba(255,255,255,.18);box-shadow:0 12px 30px rgba(0,0,0,.28)}
.magnet:active{cursor:grabbing}.magnet.disabled{cursor:default;opacity:.82}.pole{flex:1;display:grid;place-items:center;font-size:20px;font-weight:800}
.pole.n{background:linear-gradient(135deg,#ff6c7d,#cf314e);color:white}.pole.s{background:linear-gradient(135deg,#5bbdff,#3566d6);color:white}
.name{position:absolute;left:50%;top:64px;transform:translateX(-50%);font-size:13px;font-weight:700;color:#b9c8e7}
.axis{position:absolute;bottom:14px;color:#7f91b8;font-size:11px}.left{left:7%}.right{right:7%}
</style>
</head>
<body><div id="root"></div>
<script>
(function(){
const root=document.getElementById("root");let args={magnets:[],positions:{},disabled:false};let positions={};let drag=null;
function send(type,payload){window.parent.postMessage(Object.assign({isStreamlitMessage:true,type:type},payload),"*")}
function ready(){send("streamlit:componentReady",{apiVersion:1});send("streamlit:setFrameHeight",{height:360})}
function px(x,lab){const w=lab.clientWidth,l=w*.08,u=w*.84;return l+((x+4)/8)*u}
function val(p,lab){const w=lab.clientWidth,l=w*.08,u=w*.84;return Math.max(-4,Math.min(4,((p-l)/u)*8-4))}
function publish(){send("streamlit:setComponentValue",{valueType:"json",value:Object.assign({},positions)})}
function render(){
positions=Object.assign({},args.positions||{});root.innerHTML="";
const lab=document.createElement("div");lab.className="lab";
const grid=document.createElement("div");grid.className="grid";lab.appendChild(grid);
const hint=document.createElement("div");hint.className="hint";hint.textContent=args.disabled?"Experiment is running":(args.hint||"Drag a magnet to choose its position");lab.appendChild(hint);
for(const [text,cls] of [["-4","left"],["+4","right"]]){const a=document.createElement("div");a.className="axis "+cls;a.textContent=text;lab.appendChild(a)}
root.appendChild(lab);
for(const m of (args.magnets||[])){
const el=document.createElement("div");el.className="magnet"+(args.disabled?" disabled":"");el.dataset.name=m.name;el.style.left=px(Number(positions[m.name]||0),lab)+"px";
const a=document.createElement("div");a.className="pole "+m.left_pole.toLowerCase();a.textContent=m.left_pole;
const b=document.createElement("div");b.className="pole "+m.right_pole.toLowerCase();b.textContent=m.right_pole;
const n=document.createElement("div");n.className="name";n.textContent=m.name;el.append(a,b,n);lab.appendChild(el);
if(!args.disabled){
el.addEventListener("mousedown",e=>{
if(e.button!==0)return;
drag={name:m.name};
e.preventDefault();
});
}}
send("streamlit:setFrameHeight",{height:360})
}
document.addEventListener("mousemove",e=>{
if(!drag||args.disabled)return;
const lab=document.querySelector(".lab");
if(!lab)return;
const r=lab.getBoundingClientRect();
positions[drag.name]=Math.round(val(e.clientX-r.left,lab)*4)/4;
const el=document.querySelector('.magnet[data-name="'+drag.name+'"]');
if(el)el.style.left=px(positions[drag.name],lab)+"px";
e.preventDefault();
});
document.addEventListener("mouseup",e=>{
if(!drag||e.button!==0)return;
publish();
drag=null;
});
window.addEventListener("blur",()=>{drag=null});
window.addEventListener("message",e=>{if(e.data&&e.data.type==="streamlit:render"){args=e.data.args||args;render()}});
ready();
})();
</script>
</body>
</html>
