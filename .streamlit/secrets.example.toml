# Copy this file to .streamlit/secrets.toml locally.
# NEVER commit secrets.toml to Git.

[auth]
# Local development callback for `uv run streamlit run app.py`.
redirect_uri = "http://localhost:8501/oauth2callback"
# Generate a strong random value locally. Do not reuse a public example.
cookie_secret = "REPLACE_WITH_A_LOCAL_RANDOM_SECRET"

[auth.google]
client_id = "REPLACE_WITH_GOOGLE_CLIENT_ID"
client_secret = "REPLACE_WITH_GOOGLE_CLIENT_SECRET"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"
